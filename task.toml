artifacts = ["/app/report.json"]

[task]
name = "dynamo/log-report"
description = "Parse an Apache-style access log into a small JSON summary report."

[metadata]
category = "data_processing_and_etl"
subcategory = "text_processing"
task_objective = ["transform", "generate"]
artifact_type = ["text_or_log_file", "generated_output_artifact"]
expert_time_estimate_hours = 0.3
model_tested = "GPT-5.4"
agent_tested = "Terminus-2"
difficulty_explanation = "Deliberately simple domain task used as a Harbor-format repair exercise, not a difficulty benchmark; the reasoning tested is log parsing and JSON summarization from a fixed input file."
solution_explanation = "Read /app/access.log line by line, count total lines, collect the set of leading IPs, and tally the HTTP request path out of each quoted request line with a Counter to find the most common one; write the three fields to /app/report.json."
verification_explanation = "The verifier loads /app/report.json and asserts it is valid JSON containing exactly total_requests, unique_ips, and top_path, then checks each value against the exact counts derivable from the fixed, baked-in access.log (6 requests, 3 unique IPs, top_path /index.html)."

[verifier]
timeout_sec = 120.0

[agent]
timeout_sec = 120.0

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
allow_internet = true
mcp_servers = []
